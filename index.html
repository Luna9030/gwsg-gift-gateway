<!-- =====================================================
     GROW WELL SG TEXT UPDATE
     Paste this entire block immediately before </body>
====================================================== -->

<style>
  /* Hide the previous subtitle line */
  .subtitle {
    display: none !important;
  }

  /* Styling for the revised instruction */
  .final-note {
    display: block !important;
    max-width: 760px;
    margin: 14px auto 0;
    color: #66666f;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
  }

  /* Styling for the message shown after selection */
  #status {
    max-width: 760px;
    margin: 20px auto 0;
    color: #303036 !important;
    font-size: 1rem;
    line-height: 1.5;
    text-align: center;
  }

  #status strong {
    display: block;
    margin-bottom: 2px;
    color: #303036;
    font-family:
      ui-rounded,
      "Arial Rounded MT Bold",
      "Trebuchet MS",
      Arial,
      sans-serif;
    font-size: 1.15rem;
    font-weight: 900;
  }

  #status .resource-message {
    display: block;
  }

  #status a {
    color: #34788c;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
</style>

<script>
(() => {
  "use strict";

  /*
    This update changes only the displayed wording.
    It does not change the existing resource links,
    logo, localStorage, or single-choice logic.
  */

  const eyebrow =
    document.querySelector(".eyebrow");

  const heading =
    document.querySelector(".hero h1") ||
    document.querySelector("h1");

  const subtitle =
    document.querySelector(".subtitle");

  let finalNote =
    document.querySelector(".final-note");

  const status =
    document.getElementById("status");


  /*
    1. Update the small heading
  */

  if (eyebrow) {
    eyebrow.textContent =
      "GOT 10 MINUTES? LET’S GROW WELL TOGETHER!";
  }


  /*
    2. Update the main heading
  */

  if (heading) {
    heading.textContent =
      "Pick one of the following";
  }


  /*
    3. Remove the previous subtitle
  */

  if (subtitle) {
    subtitle.remove();
  }


  /*
    4. Update or create the instruction below
       the main heading
  */

  if (!finalNote && heading) {
    finalNote =
      document.createElement("p");

    finalNote.className =
      "final-note";

    heading.insertAdjacentElement(
      "afterend",
      finalNote
    );
  }

  if (finalNote) {
    finalNote.textContent =
      "You can redeem the others as you explore other Grow Well SG spots.";
  }


  /*
    5. Replace the message shown after a pillar
       has been selected
  */

  function updateSelectedMessage() {
    if (!status) {
      return;
    }

    const selectedCard =
      document.querySelector(".card.selected");

    if (!selectedCard) {
      return;
    }

    const label =
      selectedCard.dataset.label ||
      selectedCard
        .querySelector(".title")
        ?.textContent
        .replace(/\s+/g, " ")
        .trim() ||
      "your selected pillar";

    /*
      Avoid repeatedly replacing the same message.
    */

    const messageIsAlreadyUpdated =
      status.dataset.copyFor === label &&
      status.textContent.includes(
        "For more resources, please visit"
      );

    if (messageIsAlreadyUpdated) {
      return;
    }

    status.dataset.copyFor =
      label;

    status.innerHTML =
      `<strong>You’ve chosen ${label}!</strong>` +
      `<span class="resource-message">` +
      `For more resources, please visit ` +
      `<a ` +
      `href="https://www.healthhub.sg/programmes/parent-hub/grow-well-sg" ` +
      `target="_blank" ` +
      `rel="noopener noreferrer"` +
      `>Parent Hub</a>.` +
      `</span>`;
  }


  /*
    Watch for the original single-choice script
    to display its selected message, then replace
    that message with the new copy.
  */

  if (status) {
    const observer =
      new MutationObserver(
        updateSelectedMessage
      );

    observer.observe(
      status,
      {
        childList: true,
        subtree: true,
        characterData: true
      }
    );
  }


  /*
    Update immediately if this browser has already
    selected a pillar.
  */

  updateSelectedMessage();


  /*
    Update again when returning from the resource.
  */

  window.addEventListener(
    "pageshow",
    updateSelectedMessage
  );

  window.addEventListener(
    "focus",
    updateSelectedMessage
  );

})();
</script>
