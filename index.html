<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffaf6">
<meta name="description" content="Choose a Grow Well SG pillar and redeem your gift resource.">
<title>Redeem Your Grow Well SG Gift</title>

<style>
:root{
  --ink:#303036;
  --muted:#66666f;
  --paper:#fffaf6;
  --teal:#00aaa6;
  --active:#f58a1f;
  --eat:#f4cc09;
  --screen:#ee4d9b;
  --sleep:#009ee2;
  --rounded:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;
  --body:Arial,Helvetica,sans-serif
}

*,*::before,*::after{
  box-sizing:border-box
}

html{
  min-width:320px;
  background:var(--paper)
}

body{
  min-height:100vh;
  min-height:100svh;
  margin:0;
  overflow-x:hidden;
  color:var(--ink);
  font-family:var(--body);
  background:
    radial-gradient(circle at 7% 8%,rgba(0,170,166,.10) 0 90px,transparent 91px),
    radial-gradient(circle at 92% 10%,rgba(244,204,9,.14) 0 118px,transparent 119px),
    radial-gradient(circle at 95% 94%,rgba(238,77,155,.09) 0 155px,transparent 156px),
    linear-gradient(180deg,#fff 0%,var(--paper) 100%)
}

body::before,
body::after{
  position:fixed;
  z-index:-1;
  width:190px;
  height:190px;
  border-radius:48% 52% 63% 37%/41% 45% 55% 59%;
  content:"";
  pointer-events:none
}

body::before{
  top:-92px;
  left:-62px;
  background:rgba(245,138,31,.10);
  transform:rotate(22deg)
}

body::after{
  right:-82px;
  bottom:-94px;
  background:rgba(0,158,226,.09);
  transform:rotate(-18deg)
}

.skip{
  position:fixed;
  top:10px;
  left:10px;
  z-index:100;
  padding:10px 14px;
  border-radius:12px;
  color:#fff;
  background:var(--ink);
  transform:translateY(-160%);
  transition:transform .16s ease
}

.skip:focus{
  transform:translateY(0)
}

.page{
  width:min(1240px,calc(100% - 32px));
  margin:0 auto;
  padding:clamp(28px,5vw,60px) 0 34px
}

.hero{
  max-width:820px;
  margin:0 auto clamp(30px,5vw,50px);
  text-align:center
}

.brand{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
  padding:8px 15px 8px 10px;
  border:1px solid rgba(48,48,54,.09);
  border-radius:999px;
  background:rgba(255,255,255,.9);
  box-shadow:0 8px 24px rgba(48,48,54,.06)
}

.brand svg{
  width:35px;
  height:31px;
  flex:0 0 auto
}

.brand span{
  font-family:var(--rounded);
  font-weight:900;
  letter-spacing:.01em
}

.eyebrow{
  margin:0 0 12px;
  color:#008f8b;
  font-family:var(--rounded);
  font-size:clamp(.76rem,1.5vw,.92rem);
  font-weight:900;
  letter-spacing:.13em;
  line-height:1.4;
  text-transform:uppercase
}

h1{
  margin:0;
  font-family:var(--rounded);
  font-size:clamp(2.35rem,6vw,4.7rem);
  font-weight:900;
  letter-spacing:-.045em;
  line-height:.98;
  text-wrap:balance
}

.subtitle{
  margin:18px 0 0;
  color:var(--muted);
  font-size:clamp(1.05rem,2vw,1.22rem);
  font-weight:700
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px
}

.card{
  --accent:var(--teal);
  --soft:rgba(0,170,166,.08);
  --strong:rgba(0,170,166,.17);

  position:relative;
  display:grid;
  min-height:178px;
  grid-template-columns:84px minmax(0,1fr);
  grid-template-rows:1fr auto;
  gap:12px 14px;
  align-items:center;
  padding:26px 20px 18px;
  overflow:hidden;
  border:2px solid var(--accent);
  border-radius:30px;
  color:var(--ink);
  text-decoration:none;
  background:linear-gradient(145deg,#fff 0%,#fff 62%,var(--soft) 100%);
  box-shadow:0 18px 44px rgba(48,48,54,.09);
  isolation:isolate;
  transition:transform .18s ease,box-shadow .18s ease;
  -webkit-tap-highlight-color:transparent
}

.card::before{
  position:absolute;
  z-index:-1;
  top:-55px;
  right:-46px;
  width:130px;
  height:130px;
  border-radius:50%;
  content:"";
  background:var(--strong);
  transition:transform .22s ease
}

.card::after{
  position:absolute;
  z-index:-1;
  bottom:-48px;
  left:-36px;
  width:94px;
  height:94px;
  border:18px solid var(--soft);
  border-radius:50%;
  content:""
}

.card:hover{
  transform:translateY(-7px);
  box-shadow:0 24px 54px rgba(48,48,54,.14)
}

.card:hover::before{
  transform:scale(1.14)
}

.card:focus-visible{
  outline:4px solid var(--ink);
  outline-offset:5px
}

.card:active{
  transform:translateY(-2px) scale(.99)
}

.exercise{
  --accent:var(--active);
  --soft:rgba(245,138,31,.08);
  --strong:rgba(245,138,31,.18)
}

.eat{
  --accent:var(--eat);
  --soft:rgba(244,204,9,.10);
  --strong:rgba(244,204,9,.21)
}

.screen{
  --accent:var(--screen);
  --soft:rgba(238,77,155,.08);
  --strong:rgba(238,77,155,.17)
}

.sleep{
  --accent:var(--sleep);
  --soft:rgba(0,158,226,.08);
  --strong:rgba(0,158,226,.17)
}

.iconbox{
  display:grid;
  width:84px;
  height:102px;
  place-items:center
}

.icon{
  display:block;
  width:84px;
  height:94px;
  overflow:visible;
  filter:drop-shadow(0 7px 8px rgba(48,48,54,.08))
}

.title{
  margin:0;
  font-family:var(--rounded);
  font-size:clamp(1.65rem,2.2vw,2rem);
  font-weight:900;
  letter-spacing:-.035em;
  line-height:.98
}

.title span{
  display:block
}

.cardfoot{
  display:flex;
  grid-column:1/-1;
  justify-content:flex-end
}

.arrow{
  display:inline-grid;
  width:34px;
  height:34px;
  place-items:center;
  border-radius:50%;
  color:#fff;
  font-size:1.08rem;
  font-weight:900;
  background:var(--accent);
  box-shadow:0 7px 16px var(--strong);
  transition:transform .18s ease
}

.card:hover .arrow{
  transform:translate(2px,-2px)
}

.footer{
  margin-top:clamp(32px,5vw,54px);
  padding-top:18px;
  border-top:1px solid rgba(48,48,54,.08);
  color:#777780;
  font-size:.82rem;
  line-height:1.5;
  text-align:center
}

@media(max-width:1080px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }

  .title{
    font-size:clamp(1.85rem,4vw,2.2rem)
  }
}

@media(max-width:580px){
  .page{
    width:min(100% - 24px,520px);
    padding-top:22px
  }

  .hero{
    margin-bottom:28px
  }

  .brand{
    margin-bottom:16px
  }

  .grid{
    grid-template-columns:1fr;
    gap:13px
  }

  .card{
    min-height:132px;
    grid-template-columns:76px minmax(0,1fr) 34px;
    grid-template-rows:1fr;
    gap:8px 14px;
    padding:19px;
    border-radius:25px
  }

  .iconbox{
    width:76px;
    height:88px;
    grid-column:1;
    grid-row:1
  }

  .icon{
    width:76px;
    height:86px
  }

  .title{
    grid-column:2;
    grid-row:1;
    font-size:clamp(1.8rem,9vw,2.2rem)
  }

  .cardfoot{
    display:contents
  }

  .arrow{
    grid-column:3;
    grid-row:1;
    align-self:center
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition-duration:.01ms!important
  }
}
</style>
</head>
