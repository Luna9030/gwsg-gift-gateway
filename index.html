<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf6">
  <meta
    name="description"
    content="Choose one Grow Well SG pillar to view a token of appreciation."
  >

  <title>Grow Well SG Token of Appreciation</title>

  <style>
    :root {
      --ink: #303036;
      --muted: #66666f;
      --paper: #fffaf6;
      --teal: #00aaa6;
      --active: #f58a1f;
      --eat: #f4cc09;
      --screen: #ee4d9b;
      --sleep: #009ee2;
      --danger: #b62929;

      --rounded:
        ui-rounded,
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        Arial,
        sans-serif;

      --body:
        Arial,
        Helvetica,
        sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: var(--body);

      background:
        radial-gradient(
          circle at 7% 8%,
          rgba(0, 170, 166, 0.10) 0 90px,
          transparent 91px
        ),
        radial-gradient(
          circle at 92% 10%,
          rgba(244, 204, 9, 0.14) 0 118px,
          transparent 119px
        ),
        radial-gradient(
          circle at 95% 94%,
          rgba(238, 77, 155, 0.09) 0 155px,
          transparent 156px
        ),
        linear-gradient(
          180deg,
          #ffffff 0%,
          var(--paper) 100%
        );
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 190px;
      height: 190px;
      border-radius: 48% 52% 63% 37% / 41% 45% 55% 59%;
      content: "";
      pointer-events: none;
    }

    body::before {
      top: -92px;
      left: -62px;
      background: rgba(245, 138, 31, 0.10);
      transform: rotate(22deg);
    }

    body::after {
      right: -82px;
      bottom: -94px;
      background: rgba(0, 158, 226, 0.09);
      transform: rotate(-18deg);
    }

    .page {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(28px, 5vw, 60px) 0 34px;
    }

    .hero {
      max-width: 850px;
      margin: 0 auto clamp(30px, 5vw, 50px);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 8px 15px 8px 10px;
      border: 1px solid rgba(48, 48, 54, 0.09);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.90);
      box-shadow: 0 8px 24px rgba(48, 48, 54, 0.06);
    }

    .brand svg {
      width: 35px;
      height: 31px;
      flex: 0 0 auto;
    }

    .brand span {
      font-family: var(--rounded);
      font-weight: 900;
      letter-spacing: 0.01em;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #008f8b;
      font-family: var(--rounded);
      font-size: clamp(0.76rem, 1.5vw, 0.92rem);
      font-weight: 900;
      letter-spacing: 0.13em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--rounded);
      font-size: clamp(2.35rem, 6vw, 4.7rem);
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.98;
      text-wrap: balance;
    }

    .subtitle {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.22rem);
      font-weight: 700;
    }

    .final-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .status {
      min-height: 1.4em;
      margin: 12px 0 0;
      color: #087d79;
      font-size: 0.94rem;
      font-weight: 800;
    }

    .status.error {
      color: var(--danger);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      --accent: var(--teal);
      --soft: rgba(0, 170, 166, 0.08);
      --strong: rgba(0, 170, 166, 0.17);

      position: relative;
      display: grid;
      min-height: 178px;
      grid-template-columns: 84px minmax(0, 1fr);
      grid-template-rows: 1fr auto;
      gap: 12px 14px;
      align-items: center;
      padding: 26px 20px 18px;
      overflow: hidden;

      border: 2px solid var(--accent);
      border-radius: 30px;

      color: var(--ink);
      font: inherit;
      text-align: left;

      appearance: none;
      cursor: pointer;

      background:
        linear-gradient(
          145deg,
          #ffffff 0%,
          #ffffff 62%,
          var(--soft) 100%
        );

      box-shadow:
        0 18px 44px rgba(48, 48, 54, 0.09);

      isolation: isolate;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        opacity 0.18s ease,
        filter 0.18s ease;

      -webkit-tap-highlight-color: transparent;
    }

    .card::before {
      position: absolute;
      z-index: -1;
      top: -55px;
      right: -46px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      content: "";
      background: var(--strong);
      transition: transform 0.22s ease;
    }

    .card::after {
      position: absolute;
      z-index: -1;
      bottom: -48px;
      left: -36px;
      width: 94px;
      height: 94px;
      border: 18px solid var(--soft);
      border-radius: 50%;
      content: "";
    }

    .card:hover:not(:disabled) {
      transform: translateY(-7px);
      box-shadow:
        0 24px 54px rgba(48, 48, 54, 0.14);
    }

    .card:hover:not(:disabled)::before {
      transform: scale(1.14);
    }

    .card:focus-visible {
      outline: 4px solid var(--ink);
      outline-offset: 5px;
    }

    .card:active:not(:disabled) {
      transform: translateY(-2px) scale(0.99);
    }

    .card:disabled {
      cursor: not-allowed;
      opacity: 0.30;
      filter: grayscale(0.75);
      transform: none;
      box-shadow: none;
    }

    .card.selected {
      opacity: 1;
      filter: none;
      transform: translateY(-4px) scale(1.01);
      box-shadow:
        0 24px 54px var(--strong);
    }

    .exercise {
      --accent: var(--active);
      --soft: rgba(245, 138, 31, 0.08);
      --strong: rgba(245, 138, 31, 0.18);
    }

    .eat {
      --accent: var(--eat);
      --soft: rgba(244, 204, 9, 0.10);
      --strong: rgba(244, 204, 9, 0.21);
    }

    .screen {
      --accent: var(--screen);
      --soft: rgba(238, 77, 155, 0.08);
      --strong: rgba(238, 77, 155, 0.17);
    }

    .sleep {
      --accent: var(--sleep);
      --soft: rgba(0, 158, 226, 0.08);
      --strong: rgba(0, 158, 226, 0.17);
    }

    .iconbox {
      display: grid;
      width: 84px;
      height: 102px;
      place-items: center;
    }

    .icon {
      display: block;
      width: 84px;
      height: 94px;
      overflow: visible;

      filter:
        drop-shadow(
          0 7px 8px rgba(48, 48, 54, 0.08)
        );
    }

    .title {
      margin: 0;
      font-family: var(--rounded);
      font-size: clamp(1.65rem, 2.2vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 0.98;
    }

    .title span {
      display: block;
    }

    .cardfoot {
      display: flex;
      grid-column: 1 / -1;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .selected-label {
      display: none;
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 0.74rem;
      font-weight: 900;
      background: var(--strong);
    }

    .card.selected .selected-label {
      display: inline-flex;
    }

    .arrow {
      display: inline-grid;
      width: 34px;
      height: 34px;
      margin-left: auto;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      font-size: 1.08rem;
      font-weight: 900;
      background: var(--accent);
      box-shadow: 0 7px 16px var(--strong);
      transition: transform 0.18s ease;
    }

    .card:hover:not(:disabled) .arrow {
      transform: translate(2px, -2px);
    }

    .footer {
      margin-top: clamp(32px, 5vw, 54px);
      padding-top: 18px;
      border-top: 1px solid rgba(48, 48, 54, 0.08);
      color: #777780;
      font-size: 0.82rem;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 1080px) {
      .grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .title {
        font-size:
          clamp(1.85rem, 4vw, 2.2rem);
      }
    }

    @media (max-width: 580px) {
      .page {
        width: min(100% - 24px, 520px);
        padding-top: 22px;
      }

      .hero {
        margin-bottom: 28px;
      }

      .brand {
        margin-bottom: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .card {
        min-height: 132px;
        grid-template-columns:
          76px minmax(0, 1fr) 34px;
        grid-template-rows: 1fr;
        gap: 8px 14px;
        padding: 19px;
        border-radius: 25px;
      }

      .iconbox {
        width: 76px;
        height: 88px;
        grid-column: 1;
        grid-row: 1;
      }

      .icon {
        width: 76px;
        height: 86px;
      }

      .title {
        grid-column: 2;
        grid-row: 1;
        font-size:
          clamp(1.8rem, 9vw, 2.2rem);
      }

      .cardfoot {
        display: contents;
      }

      .selected-label {
        display: none !important;
      }

      .arrow {
        grid-column: 3;
        grid-row: 1;
        align-self: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <script>
    (() => {
      "use strict";

      /*
        This is a new storage key.

        The previous version used gwsgGiftChoice_v1
        and automatically redirected some browsers
        to Eat Well.
      */

      const STORAGE_KEY =
        "gwsgOnePillarChoice_v4";

      const COOKIE_KEY =
        "gwsgOnePillarChoice_v4";

      const CHANNEL_NAME =
        "gwsgOnePillarChoiceChannel_v4";


      /*
        These are the saved settings used by the
        earlier versions.

        They are removed so the previous Eat Well
        redirect and countdown do not continue.
      */

      const LEGACY_KEYS = [
        "gwsgGiftChoice_v1",
        "gwsgGiftChoice_v2",
        "gwsgGiftChoice_v3",
        "gwsgGiftDeadline_v1"
      ];


      const cards = Array.from(
        document.querySelectorAll(".card")
      );

      const status =
        document.getElementById("status");

      let opening = false;
      let channel = null;


      function expireCookie(name) {
        document.cookie =
          `${name}=; ` +
          "Max-Age=0; " +
          "Path=/; " +
          "SameSite=Lax";
      }


      /*
        Remove all settings from the previous
        broken versions.
      */

      for (const key of LEGACY_KEYS) {
        try {
          localStorage.removeItem(key);
        } catch (error) {
          /*
            Continue with cookie cleanup.
          */
        }

        expireCookie(key);
      }


      function getCookie(name) {
        const prefix = `${name}=`;

        const item = document.cookie
          .split("; ")
          .find(part =>
            part.startsWith(prefix)
          );

        if (!item) {
          return null;
        }

        try {
          return decodeURIComponent(
            item.slice(prefix.length)
          );
        } catch (error) {
          return null;
        }
      }


      function cardForPillar(pillar) {
        return cards.find(
          card =>
            card.dataset.pillar === pillar
        ) || null;
      }


      /*
        Verify that a saved choice matches one of
        the four current pillar buttons.
      */

      function validateChoice(value) {
        if (
          !value ||
          typeof value !== "object"
        ) {
          return null;
        }

        const selectedCard =
          cardForPillar(value.pillar);

        if (!selectedCard) {
          return null;
        }

        return {
          pillar:
            selectedCard.dataset.pillar,

          label:
            selectedCard.dataset.label,

          url:
            selectedCard.dataset.url,

          selectedAt:
            value.selectedAt || ""
        };
      }


      function parseChoice(raw) {
        if (!raw) {
          return null;
        }

        try {
          return validateChoice(
            JSON.parse(raw)
          );
        } catch (error) {
          return null;
        }
      }


      /*
        Read the participant's saved pillar.

        Local storage is the main method.
        A cookie is used as a fallback.
      */

      function readChoice() {
        try {
          const fromStorage =
            parseChoice(
              localStorage.getItem(
                STORAGE_KEY
              )
            );

          if (fromStorage) {
            return fromStorage;
          }
        } catch (error) {
          /*
            Continue to cookie fallback.
          */
        }

        return parseChoice(
          getCookie(COOKIE_KEY)
        );
      }


      /*
        Save the selected pillar before opening
        the resource.
      */

      function saveChoice(choice) {
        const raw =
          JSON.stringify(choice);

        try {
          localStorage.setItem(
            STORAGE_KEY,
            raw
          );
        } catch (error) {
          /*
            Cookie fallback below.
          */
        }

        document.cookie =
          `${COOKIE_KEY}=` +
          `${encodeURIComponent(raw)}; ` +
          "Max-Age=31536000; " +
          "Path=/; " +
          "SameSite=Lax; " +
          "Secure";
      }


      /*
        Keep only the selected pillar available.

        The selected pillar can reopen the same
        resource. The other three are disabled.
      */

      function applyLockedState(choice) {
        cards.forEach(card => {
          const isSelected =
            card.dataset.pillar ===
            choice.pillar;

          card.disabled =
            !isSelected;

          card.classList.toggle(
            "selected",
            isSelected
          );

          card.setAttribute(
            "aria-pressed",
            isSelected
              ? "true"
              : "false"
          );

          if (isSelected) {
            card.setAttribute(
              "aria-label",
              `Open your selected ${choice.label} resource again`
            );
          } else {
            card.setAttribute(
              "aria-label",
              `${card.dataset.label} is locked because ${choice.label} was selected`
            );
          }
        });

        status.classList.remove(
          "error"
        );

        status.textContent =
          `${choice.label} has been selected. ` +
          "The other three choices are now locked.";
      }


      function restoreUnlockedState() {
        cards.forEach(card => {
          card.disabled = false;

          card.classList.remove(
            "selected"
          );

          card.removeAttribute(
            "aria-pressed"
          );

          card.setAttribute(
            "aria-label",
            `Choose ${card.dataset.label}`
          );
        });
      }


      /*
        Open the resource in a separate tab.

        The gateway remains open and visibly shows
        that the other three pillars are locked.
      */

      function openResource(url) {
        const link =
          document.createElement("a");

        link.href = url;
        link.target = "_blank";
        link.rel =
          "noopener noreferrer";

        link.style.display =
          "none";

        document.body.appendChild(
          link
        );

        link.click();
        link.remove();
      }


      /*
        Inform any other open gateway tabs that
        a pillar has been selected.
      */

      function announceChoice() {
        if (channel) {
          channel.postMessage({
            type: "choice-made"
          });
        }
      }


      /*
        Process a pillar click.

        If there is already a saved choice, only
        that same selected resource can open.
      */

      function choosePillar(card) {
        if (opening) {
          return;
        }

        opening = true;

        const existing =
          readChoice();


        /*
          A choice already exists.

          Do not allow a different pillar.
          Reopen only the selected pillar.
        */

        if (existing) {
          applyLockedState(
            existing
          );

          if (
            existing.pillar ===
            card.dataset.pillar
          ) {
            openResource(
              existing.url
            );
          }

          window.setTimeout(() => {
            opening = false;
          }, 700);

          return;
        }


        /*
          No choice exists yet, so save the first
          pillar selected.
        */

        const newChoice = {
          pillar:
            card.dataset.pillar,

          label:
            card.dataset.label,

          url:
            card.dataset.url,

          selectedAt:
            new Date().toISOString()
        };


        saveChoice(newChoice);


        /*
          Confirm the choice was saved successfully
          before opening the resource.
        */

        const verifiedChoice =
          readChoice();

        if (!verifiedChoice) {
          restoreUnlockedState();

          status.classList.add(
            "error"
          );

          status.textContent =
            "Your browser blocked the storage needed " +
            "to lock the other choices. Please allow " +
            "cookies or site storage and try again.";

          opening = false;
          return;
        }


        applyLockedState(
          verifiedChoice
        );

        announceChoice();

        openResource(
          verifiedChoice.url
        );


        window.setTimeout(() => {
          opening = false;
        }, 700);
      }


      cards.forEach(card => {
        card.addEventListener(
          "click",
          () => choosePillar(card)
        );
      });


      /*
        Synchronise the selection between multiple
        gateway tabs in the same browser.
      */

      if (
        "BroadcastChannel" in window
      ) {
        try {
          channel =
            new BroadcastChannel(
              CHANNEL_NAME
            );

          channel.addEventListener(
            "message",
            () => {
              const choice =
                readChoice();

              if (choice) {
                applyLockedState(
                  choice
                );
              }
            }
          );
        } catch (error) {
          channel = null;
        }
      }


      /*
        Also detect the saved choice through
        local-storage changes in other tabs.
      */

      window.addEventListener(
        "storage",
        event => {
          if (
            event.key ===
            STORAGE_KEY
          ) {
            const choice =
              readChoice();

            if (choice) {
              applyLockedState(
                choice
              );
            }
          }
        }
      );


      /*
        Refresh the locked state when the participant
        returns from the resource tab or reopens
        the gateway.

        This does not automatically open any resource.
      */

      function refreshLock() {
        const choice =
          readChoice();

        if (choice) {
          applyLockedState(
            choice
          );
        }
      }


      window.addEventListener(
        "pageshow",
        refreshLock
      );

      window.addEventListener(
        "focus",
        refreshLock
      );


      document.addEventListener(
        "visibilitychange",
        () => {
          if (
            document.visibilityState ===
            "visible"
          ) {
            refreshLock();
          }
        }
      );


      /*
        Check for an existing choice when the gateway
        first opens.

        Important: this only locks the buttons.
        It never automatically opens Eat Well or
        any other resource.
      */

      const savedChoice =
        readChoice();

      if (savedChoice) {
        applyLockedState(
          savedChoice
        );
      }

    })();
  </script>

</body>
</html>
