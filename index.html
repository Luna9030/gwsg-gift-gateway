<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Grow Well SG</title>

<style>
:root{
  --ink:#303036;
  --muted:#66666f;
  --paper:#fffaf6;
  --active:#f58a1f;
  --eat:#f4cc09;
  --screen:#ee4d9b;
  --sleep:#009ee2;
  --rounded:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;
  --body:Arial,Helvetica,sans-serif;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--paper);
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:var(--body);

  background:
    radial-gradient(circle at 6% 7%,rgba(0,170,166,.10) 0 90px,transparent 91px),
    radial-gradient(circle at 92% 10%,rgba(244,204,9,.14) 0 120px,transparent 121px),
    radial-gradient(circle at 95% 95%,rgba(238,77,155,.08) 0 160px,transparent 161px),
    linear-gradient(180deg,#fff 0%,#fffaf6 100%);
}

.page{
  width:min(1220px,calc(100% - 32px));
  margin:0 auto;
  padding:40px 0 34px;
}

.hero{
  max-width:920px;
  margin:0 auto 40px;
  text-align:center;
}

/* LOGO */

.logo{
  display:block;
  width:120px;
  max-width:32vw;
  height:auto;
  margin:0 auto 22px;
}

/* TEXT */

.eyebrow{
  margin:0 0 12px;
  color:#008f8b;
  font-family:var(--rounded);
  font-size:clamp(.8rem,1.5vw,.95rem);
  font-weight:900;
  letter-spacing:.11em;
  line-height:1.4;
  text-transform:uppercase;
}

h1{
  margin:0;
  font-family:var(--rounded);
  font-size:clamp(2.2rem,5vw,4.2rem);
  font-weight:900;
  letter-spacing:-.045em;
  line-height:1;
}

.subtext{
  margin:18px 0 0;
  color:var(--muted);
  font-size:clamp(1rem,2vw,1.18rem);
  font-weight:700;
}

.status{
  max-width:760px;
  margin:20px auto 0;
  color:#303036;
  font-size:1rem;
  line-height:1.5;
}

.status:empty{
  display:none;
}

.status strong{
  display:block;
  margin-bottom:2px;
  font-family:var(--rounded);
  font-size:1.15rem;
  font-weight:900;
}

.status a{
  color:#34788c;
  font-weight:700;
  text-decoration:underline;
  text-underline-offset:2px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
}

.card{
  --accent:#00aaa6;
  --soft:rgba(0,170,166,.08);
  --strong:rgba(0,170,166,.18);

  position:relative;
  display:grid;
  min-height:180px;
  grid-template-columns:82px minmax(0,1fr);
  grid-template-rows:1fr auto;
  gap:12px 14px;
  align-items:center;

  padding:24px 20px 18px;

  border:2px solid var(--accent);
  border-radius:28px;

  color:var(--ink);
  font:inherit;
  text-align:left;
  appearance:none;
  cursor:pointer;

  background:
    linear-gradient(145deg,#fff 0%,#fff 62%,var(--soft) 100%);

  box-shadow:0 16px 38px rgba(48,48,54,.09);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    opacity .18s ease,
    filter .18s ease;
}

.card::before{
  position:absolute;
  top:-45px;
  right:-40px;
  width:120px;
  height:120px;
  border-radius:50%;
  content:"";
  background:var(--strong);
  z-index:0;
}

.card > *{
  position:relative;
  z-index:1;
}

.card:hover:not(:disabled){
  transform:translateY(-6px);
  box-shadow:0 22px 48px rgba(48,48,54,.14);
}

.card:focus-visible{
  outline:4px solid #303036;
  outline-offset:4px;
}

.card:disabled{
  cursor:not-allowed;
  opacity:.30;
  filter:grayscale(.75);
  transform:none;
}

.card.selected{
  opacity:1;
  filter:none;
  transform:translateY(-3px);
  box-shadow:0 22px 48px var(--strong);
}

.exercise{
  --accent:var(--active);
  --soft:rgba(245,138,31,.08);
  --strong:rgba(245,138,31,.18);
}

.eat{
  --accent:var(--eat);
  --soft:rgba(244,204,9,.10);
  --strong:rgba(244,204,9,.22);
}

.screen{
  --accent:var(--screen);
  --soft:rgba(238,77,155,.08);
  --strong:rgba(238,77,155,.18);
}

.sleep{
  --accent:var(--sleep);
  --soft:rgba(0,158,226,.08);
  --strong:rgba(0,158,226,.18);
}

.iconbox{
  display:grid;
  width:82px;
  height:96px;
  place-items:center;
}

.icon{
  width:80px;
  height:90px;
  overflow:visible;
}

.title{
  font-family:var(--rounded);
  font-size:clamp(1.65rem,2.3vw,2rem);
  font-weight:900;
  letter-spacing:-.035em;
  line-height:1;
}

.title span{
  display:block;
}

.cardfoot{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:flex-end;
}

.selected-label{
  display:none;
  margin-right:auto;
  padding:6px 10px;
  border-radius:999px;
  background:var(--strong);
  font-size:.72rem;
  font-weight:900;
}

.card.selected .selected-label{
  display:inline-flex;
}

.arrow{
  display:grid;
  width:34px;
  height:34px;
  place-items:center;
  border-radius:50%;
  color:#fff;
  background:var(--accent);
  font-weight:900;
}

.footer{
  margin-top:42px;
  padding-top:18px;
  border-top:1px solid rgba(48,48,54,.08);
  color:#777780;
  font-size:.82rem;
  text-align:center;
}

@media(max-width:1050px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:580px){
  .page{
    width:min(100% - 24px,520px);
    padding-top:26px;
  }

  .logo{
    width:100px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:13px;
  }

  .card{
    min-height:132px;
    grid-template-columns:72px minmax(0,1fr) 34px;
    grid-template-rows:1fr;
    gap:8px 12px;
    padding:18px;
  }

  .iconbox{
    width:72px;
    height:82px;
  }

  .icon{
    width:72px;
    height:82px;
  }

  .title{
    font-size:clamp(1.8rem,9vw,2.15rem);
  }

  .cardfoot{
    display:contents;
  }

  .selected-label{
    display:none !important;
  }

  .arrow{
    grid-column:3;
    grid-row:1;
    align-self:center;
  }
}
</style>
</head>

<script>
(() => {

  "use strict";

  /*
    New storage key so old test choices
    from previous versions do not affect this page.
  */

  const STORAGE_KEY =
    "gwsg_choice_clean_v1";

  const cards =
    [...document.querySelectorAll(".card")];

  const status =
    document.getElementById("status");


  function readChoice(){

    try{

      const pillar =
        localStorage.getItem(
          STORAGE_KEY
        );

      if(!pillar){
        return null;
      }

      const card =
        cards.find(
          card =>
            card.dataset.pillar === pillar
        );

      if(!card){
        return null;
      }

      return {
        pillar:card.dataset.pillar,
        label:card.dataset.label,
        url:card.dataset.url
      };

    }

    catch(error){

      return null;

    }

  }


  function saveChoice(pillar){

    try{

      localStorage.setItem(
        STORAGE_KEY,
        pillar
      );

      return (
        localStorage.getItem(
          STORAGE_KEY
        ) === pillar
      );

    }

    catch(error){

      return false;

    }

  }


  function applyLockedState(choice){

    cards.forEach(
      card => {

        const selected =
          card.dataset.pillar ===
          choice.pillar;

        /*
          All four are disabled after one choice.
        */

        card.disabled = true;

        card.classList.toggle(
          "selected",
          selected
        );

      }
    );


    status.innerHTML =
      `<strong>You’ve chosen ${choice.label}!</strong>` +
      `For more resources, please visit ` +
      `<a ` +
      `href="https://www.healthhub.sg/programmes/parent-hub/grow-well-sg" ` +
      `target="_blank" ` +
      `rel="noopener noreferrer"` +
      `>Parent Hub</a>.`;

  }


  function openResource(url){

    const resourceWindow =
      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    /*
      If the browser blocks the new tab,
      open the resource in the current tab.
    */

    if(!resourceWindow){

      window.location.href =
        url;

    }

  }


  function choose(card){

    /*
      If a choice already exists,
      do not allow another one.
    */

    const existing =
      readChoice();

    if(existing){

      applyLockedState(
        existing
      );

      return;

    }


    const saved =
      saveChoice(
        card.dataset.pillar
      );


    if(!saved){

      status.innerHTML =
        `<strong>We couldn't save your selection.</strong>` +
        `Please allow site storage in your browser and try again.`;

      return;

    }


    const choice =
      readChoice();


    if(!choice){
      return;
    }


    /*
      Lock the page BEFORE opening the resource.
    */

    applyLockedState(
      choice
    );


    /*
      Open only the selected resource.
    */

    openResource(
      choice.url
    );

  }


  cards.forEach(
    card => {

      card.addEventListener(
        "click",
        () => choose(card)
      );

    }
  );


  /*
    If this browser already selected a pillar,
    restore the locked view.

    Do NOT automatically open any resource.
  */

  const savedChoice =
    readChoice();

  if(savedChoice){

    applyLockedState(
      savedChoice
    );

  }

})();
</script>
